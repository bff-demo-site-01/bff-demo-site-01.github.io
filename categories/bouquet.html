<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouquet Collection - MSR Tent Mart</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- MSR Tent Mart Custom Stylesheets -->
    <link href="../assets/css/variables-theme.css" rel="stylesheet">
    <link href="../assets/css/globals.css" rel="stylesheet">
    <link href="../assets/css/index.css" rel="stylesheet">
    <link href="../assets/css/catalogue.css" rel="stylesheet">
</head>
<body>
    <!-- Header will be loaded dynamically -->
    <div id="header-placeholder"></div>

    <main>
        <!-- Category Header -->
        <section class="hero-section" style="background-image: url('../assets/images/products/bouquet/mf-bw-017.jpg'); background-size: cover; background-position: center;">
            <div class="hero-content">
                <div style="max-width: 56rem;">
                    <span class="hero-badge">Premium Collection</span>
                    <h2 class="hero-title">
                        Bouquet <span class="accent">Collection</span>
                    </h2>
                    <p class="hero-description">
                        Stunning floral bouquets and bowl centerpieces crafted for memorable events.
                    </p>
                    <div class="hero-buttons">
                        <a href="../products/index.html" class="btn btn-hero btn-hero-primary">All Products</a>
                        <a href="../index.html" class="btn btn-hero btn-hero-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Products Grid -->
        <section class="services-section">
            <div class="container-max mx-auto px-responsive">
                <div class="text-center mb-5">
                    <div class="section-label"><i class="fas fa-seedling me-2"></i>Bouquet Collection</div>
                    <h2 class="section-title">Bouquet Products</h2>
                    <div class="section-divider"></div>
                </div>

                <div class="row gap-responsive" id="products-grid">
                    <!-- Products will be loaded dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer will be loaded dynamically -->
    <div id="footer-placeholder"></div>

    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadComponents();
            await initCategoryPage('bouquet');
        });
    </script>
</body>
</html>
