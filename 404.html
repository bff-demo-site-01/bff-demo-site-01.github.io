<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MSR Tent Mart</title>
    <meta name="description" content="The page you are looking for could not be found. Explore MSR Tent Mart collections for sofas, mats, flowers, and event decoration materials.">
    <link rel="canonical" href="https://bff-demo-site-01.github.io/404.html">

    <!-- Open Graph -->
    <meta property="og:title" content="Page Not Found - MSR Tent Mart">
    <meta property="og:description" content="The page you are looking for could not be found. Return to MSR Tent Mart home or explore our product collections.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bff-demo-site-01.github.io/404.html">
    <meta property="og:image" content="https://bff-demo-site-01.github.io/assets/images/msr-tent-mart-logo-1.png">

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/assets/images/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/site.webmanifest">
    <meta name="theme-color" content="#800000">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Theme Stylesheets -->
    <link href="/assets/css/variables-theme.css" rel="stylesheet">
    <link href="/assets/css/globals.css" rel="stylesheet">
    <link href="/assets/css/index.css" rel="stylesheet">
    <link href="/assets/css/catalogue.css" rel="stylesheet">
</head>
<body>
    <!-- Header loaded dynamically -->
    <div id="header-placeholder"></div>

    <main>
        <section class="services-section py-5 my-5">
            <div class="container-max mx-auto px-responsive text-center">
                <div class="py-5">
                    <span class="badge-accent mb-3">Error 404</span>
                    <h1 class="display-4 fw-bold mt-2 mb-3 text-primary">Page Not Found</h1>
                    <div class="section-divider mb-4"></div>
                    <p class="text-muted fs-5 mx-auto mb-4" style="max-width: 36rem;">
                        The page you are looking for does not exist or may have been moved.
                    </p>
                    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
                        <a href="/index.html" class="btn btn-hero btn-hero-primary px-4 py-2">
                            <i class="fas fa-home me-2"></i>Back to Home
                        </a>
                        <a href="/products/index.html" class="btn btn-hero btn-hero-secondary px-4 py-2" style="background-color: var(--primary-color); color: white; border-color: var(--primary-color);">
                            <i class="fas fa-boxes-stacked me-2"></i>View Our Products
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer loaded dynamically -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Load header & footer from root
            try {
                const hResp = await fetch('/layout/header.html');
                if (hResp.ok) {
                    const hHtml = await hResp.text();
                    const hp = document.getElementById('header-placeholder');
                    if (hp) {
                        hp.innerHTML = hHtml;
                        adaptComponentLinks(hp, './');
                    }
                }
                const fResp = await fetch('/layout/footer.html');
                if (fResp.ok) {
                    const fHtml = await fResp.text();
                    const fp = document.getElementById('footer-placeholder');
                    if (fp) {
                        fp.innerHTML = fHtml;
                        adaptComponentLinks(fp, './');
                    }
                }
            } catch (e) {
                console.warn('Could not load layout partials:', e);
            }
        });
    </script>
</body>
</html>
