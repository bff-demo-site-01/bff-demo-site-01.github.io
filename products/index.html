<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - MSR Tent Mart</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- MSR Tent Mart Custom Stylesheets -->
    <link href="../assets/css/variables-theme.css" rel="stylesheet">
    <link href="../assets/css/globals.css" rel="stylesheet">
    <link href="../assets/css/index.css" rel="stylesheet">
    <link href="../assets/css/catalogue.css" rel="stylesheet">
</head>
<body>
    <!-- Header will be loaded dynamically -->
    <div id="header-placeholder"></div>

    <main>
        <!-- Products Header -->
        <section class="hero-section" style="background-image: url('../assets/images/products/sofa/ms-w1-001.jpg'); background-size: cover; background-position: center;">
            <div class="hero-content">
                <div style="max-width: 56rem;">
                    <span class="hero-badge">Complete Collection</span>
                    <h2 class="hero-title">
                        Our <span class="accent">Products</span>
                    </h2>
                    <p class="hero-description">
                        Explore our complete range of premium event materials and decoration items. From elegant seating to beautiful floral arrangements, find everything you need for your special occasions.
                    </p>
                    <div class="hero-buttons">
                        <a href="../index.html#contact" class="btn btn-hero btn-hero-primary">Get Quote</a>
                        <a href="../index.html" class="btn btn-hero btn-hero-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Products by Category / Filtered View -->
        <div id="products-container" class="py-5">
            <!-- Driven dynamically by initAllProductsPage() -->
        </div>
    </main>

    <!-- Footer will be loaded dynamically -->
    <div id="footer-placeholder"></div>

    <script src="../assets/js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadComponents();
            await initAllProductsPage();
        });
    </script>
</body>
</html>
