<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - MSR Tent Mart</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- MSR Tent Mart Custom Stylesheets -->
    <link href="assets/css/variables-theme.css" rel="stylesheet">
    <link href="assets/css/globals.css" rel="stylesheet">
    <link href="assets/css/index.css" rel="stylesheet">
</head>
<body>
    <!-- Header will be loaded dynamically -->
    <div id="header-placeholder"></div>

    <main>
        <!-- Products Header -->
        <section class="hero-section" style="background-image: url('assets/images/products/sofa-white-ms-w-001.jpg'); background-size: cover; background-position: center;">
            <div class="hero-content">
                <div style="max-width: 56rem;">
                    <span class="hero-badge">Complete Collection</span>
                    <h2 class="hero-title">
                        Our <span class="accent">Products</span>
                    </h2>
                    <p class="hero-description">
                        Explore our complete range of premium event materials and decoration items. From elegant seating to beautiful floral arrangements, find everything you need for your special occasions.
                    </p>
                    <div class="hero-buttons">
                        <a href="index.html#contact" class="btn btn-hero btn-hero-primary">Get Quote</a>
                        <a href="index.html" class="btn btn-hero btn-hero-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Products by Category -->
        <div id="products-container">
            <!-- Products will be loaded dynamically by category -->
        </div>
    </main>

    <!-- Footer will be loaded dynamically -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/app.js"></script>

    <script>
        // Load all products and group by category
        async function loadAllProducts() {
            try {
                const response = await fetch('assets/json/product_list.json');
                const data = await response.json();

                // Group products by category
                const productsByCategory = {};
                data.products.forEach(product => {
                    if (!productsByCategory[product.category]) {
                        productsByCategory[product.category] = [];
                    }
                    productsByCategory[product.category].push(product);
                });

                const container = document.getElementById('products-container');

                // Define category order and descriptions
                const categoryInfo = {
                    'Sofa': {
                        description: 'Elegant seating solutions for your events',
                        icon: 'fas fa-couch'
                    },
                    'Mate': {
                        description: 'Traditional and modern mate collections',
                        icon: 'fas fa-chair'
                    },
                    'Screen': {
                        description: 'Decorative screens for privacy and ambiance',
                        icon: 'fas fa-columns'
                    },
                    'Flower': {
                        description: 'Beautiful artificial flowers for decorations',
                        icon: 'fas fa-flower'
                    },
                    'Bouquet': {
                        description: 'Stunning floral bouquets and arrangements',
                        icon: 'fas fa-flower-tulip'
                    },
                    'Mums': {
                        description: 'Chrysanthemum arrangements and displays',
                        icon: 'fas fa-seedling'
                    },
                    'Carnation': {
                        description: 'Elegant carnation collections',
                        icon: 'fas fa-spa'
                    }
                };

                // Create sections for each category
                Object.keys(categoryInfo).forEach(category => {
                    const products = productsByCategory[category] || [];
                    if (products.length === 0) return;

                    const categorySection = document.createElement('section');
                    categorySection.className = 'services-section';
                    categorySection.innerHTML = `
                        <div class="container-max mx-auto px-responsive">
                            <div class="text-center mb-5">
                                <div class="section-label">
                                    <i class="${categoryInfo[category].icon} me-2"></i>
                                    ${category} Collection
                                </div>
                                <h2 class="section-title">${category} Products</h2>
                                <p class="section-description">${categoryInfo[category].description}</p>
                                <div class="section-divider"></div>
                            </div>

                            <div class="row gap-responsive" id="products-${category.toLowerCase()}">
                                ${products.map(product => `
                                    <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
                                        <div class="service-card">
                                            <div class="service-image" style="background-image: url('${data.imgBasePath}${product.image}');">
                                                <div class="product-code">${product.code}</div>
                                            </div>
                                            <h4>${product.name}</h4>
                                            <p>${product.description}</p>
                                            <div class="product-price">₹${product.price}</div>
                                            <a href="${category.toLowerCase()}.html" class="btn btn-sm btn-outline-primary mt-2">View Collection</a>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="text-center mt-4">
                                <a href="${category.toLowerCase()}.html" class="btn btn-primary">
                                    View All ${category} Products <i class="fas fa-arrow-right ms-2"></i>
                                </a>
                            </div>
                        </div>
                    `;

                    container.appendChild(categorySection);
                });

            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('products-container').innerHTML = `
                    <div class="container-max mx-auto px-responsive text-center">
                        <div class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Sorry, we couldn't load the products at this time. Please try again later.
                        </div>
                    </div>
                `;
            }
        }

        // Add fade-in animation to page elements on load
        document.addEventListener('DOMContentLoaded', async function() {
            await loadComponents();
            await loadAllProducts();

            // Animate page sections
            const sections = document.querySelectorAll('section');
            const observerOptions = {
                threshold: 0.1
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-fade-in');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });

            // Mobile menu close on link click
            const navLinks = document.querySelectorAll('.nav-link-desktop');
            const mainNav = document.getElementById('main-nav');

            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    mainNav.classList.remove('open');
                });
            });
        });
    </script>
</body>
</html>
